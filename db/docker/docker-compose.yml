# Docker Compose file for DBs
name: plotline-databases
services:
  # Memory is tuned for a 16 GB host shared with other containers: Postgres keeps a small
  # cache of its own and leans on the OS page cache, which the kernel hands back to other
  # containers under memory pressure.
  postgres:
    image: postgres:18-alpine
    container_name: plotline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:?missing}
      POSTGRES_USER: ${POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=4GB # fewer checkpoints during bulk imports
    ports:
      - ${POSTGRES_PORT:?missing}:5432 # 5432 on the host is taken by another stack
    volumes:
      - ${POSTGRES_DB_DIR:?missing}:/var/lib/postgresql # Postgres 18 images keep data under a versioned subfolder here
    shm_size: 1gb # Postgres uses shared memory for parallel queries; Docker's 64 MB default is too small

  redis:
    image: redis:8.4.0-alpine
    container_name: plotline-redis
    restart: unless-stopped
    # Cache only, so cap it and evict the least-used keys rather than grow.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?missing}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - ${REDIS_PORT:?missing}:6379
    volumes:
      - ${REDIS_DB_DIR:?missing}:/data
